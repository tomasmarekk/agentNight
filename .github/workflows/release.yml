name: Release

# Run manually from the Actions tab. The version comes from src-tauri/tauri.conf.json;
# bump it there (and in Cargo.toml) before releasing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "tag=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A published release with this tag stops the run; drafts left by failed runs are replaced.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"' > existing.txt
          while read -r id draft; do
            if [ "$draft" = "true" ]; then
              echo "Removing unfinished draft $id from an earlier run"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            else
              echo "::error::Release $TAG already exists. Bump the version in src-tauri/tauri.conf.json first."
              exit 1
            fi
          done < existing.txt
          cat > notes.md <<'EOF'
          Turns your computer off once your AI coding agents finish their work.

          | Platform | Download |
          | --- | --- |
          | Windows | `agentNight_*_x64-setup.exe` or `.msi` |
          | macOS (Apple Silicon and Intel) | `agentNight_*_universal.dmg` |
          | Linux | `.AppImage`, `.deb` or `.rpm` |

          The builds are not code-signed yet, see the README for the first-launch steps.
          EOF
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="agentNight $TAG" \
            -F draft=true -F body=@notes.md --jq .id)
          if [ -z "$id" ]; then
            echo "::error::Could not create the draft release"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check release id
        shell: bash
        run: test -n "${{ needs.create-release.outputs.release_id }}"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '[.assets[].name] | join("\n")')
          echo "$assets"
          for pattern in '_x64-setup\.exe$' '\.msi$' '\.dmg$' '\.AppImage$' '\.deb$' '\.rpm$'; do
            if ! grep -qE "$pattern" <<< "$assets"; then
              echo "::error::No installer matching $pattern was uploaded; leaving the release as a draft."
              exit 1
            fi
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq .html_url
